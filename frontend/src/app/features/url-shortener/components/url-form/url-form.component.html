<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
  <div>
    <label for="url" class="block text-sm font-medium text-gray-700">URL</label>
    <input
      id="url"
      type="text"
      formControlName="url"
      placeholder="https://example.com/long/url"
      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border"
      [class.border-red-500]="form.get('url')?.invalid && form.get('url')?.touched"
    />
    @if (form.get('url')?.invalid && form.get('url')?.touched) {
      <p class="mt-1 text-sm text-red-600">{{ getUrlError() }}</p>
    }
  </div>

  <div>
    <label for="customAlias" class="block text-sm font-medium text-gray-700">
      Custom Alias (optional)
    </label>
    <input
      id="customAlias"
      type="text"
      formControlName="customAlias"
      placeholder="my-link"
      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border"
    />
    <p class="mt-1 text-xs text-gray-500">3-32 characters, letters, numbers, _ and - only</p>
    @if (form.get('customAlias')?.invalid && form.get('customAlias')?.touched) {
      <p class="mt-1 text-sm text-red-600">Invalid alias format</p>
    }
  </div>

  <div>
    <label for="expirationDays" class="block text-sm font-medium text-gray-700">
      Expiration (optional)
    </label>
    <select
      id="expirationDays"
      formControlName="expirationDays"
      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border"
    >
      <option [ngValue]="null">Never</option>
      <option [ngValue]="7">7 days</option>
      <option [ngValue]="30">30 days</option>
      <option [ngValue]="90">90 days</option>
      <option [ngValue]="365">365 days</option>
    </select>
  </div>

  <button
    type="submit"
    [disabled]="form.invalid"
    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed"
  >
    Shorten URL
  </button>
</form>
